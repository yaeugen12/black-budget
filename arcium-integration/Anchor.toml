[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Replace with the address produced by `solana-keygen new -o target/deploy/confidential_policy-keypair.json`
# then `anchor keys sync`.
confidential_policy = "EJphDwZdNmD972zPBjH3phvUga9Gamv21R1usMoQ4A6X"

[programs.devnet]
# After `arcium deploy --cluster devnet`, paste the resulting program ID here.
confidential_policy = "EJphDwZdNmD972zPBjH3phvUga9Gamv21R1usMoQ4A6X"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 2000000 \"tests/**/*.ts\""

[test]
startup_wait = 120000
shutdown_wait = 5000
upgradeable = false

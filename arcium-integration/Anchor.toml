[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Replace with the address produced by `solana-keygen new -o target/deploy/confidential_policy-keypair.json`
# then `anchor keys sync`.
confidential_policy = "ConfidentialPolicy1111111111111111111111111"

[programs.devnet]
# After `arcium deploy --cluster devnet`, paste the resulting program ID here.
# confidential_policy = "..."

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 2000000 \"tests/**/*.ts\""

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = false

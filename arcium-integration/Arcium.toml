# Arcium configuration for Black Budget's confidential-policy program.
# See https://docs.arcium.com for full reference.

[localnet]
# Number of MPC nodes spawned in the local cluster for testing.
nodes = 2
# Override node IPs (default: 172.20.0.[100..(100 + nodes - 1)])
nodes_ips = [
  [172, 20, 0, 100],
  [172, 20, 0, 101]
]
# Seconds to wait for the localnet cluster to come online.
localnet_timeout_secs = 60
# MPC backends supported by the MXE. Supported values: "Cerberus".
backends = ["Cerberus"]

# ── Cluster offsets for non-localnet testing ─────────────────────────────────
# Get your offset from `arcium init-mxe` or `arcium deploy`.
# RPC URLs come from Anchor.toml's [provider] section.
#
# Example: `arcium test --cluster devnet`

# [clusters.devnet]
# offset = 0

# [clusters.mainnet]
# offset = 0

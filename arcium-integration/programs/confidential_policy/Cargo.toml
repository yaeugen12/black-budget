[package]
name = "confidential-policy"
version = "0.1.0"
description = "Confidential treasury policy evaluation via Arcium MXE — companion program to Black Budget"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "confidential_policy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

arcium-client = { default-features = false, version = "=0.9.6" }
arcium-macros = "0.9.6"
arcium-anchor = "0.9.6"
# Pin to avoid the resolver bumping into edition2024-only crates.
unicode-segmentation = { version = "=1.12.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
